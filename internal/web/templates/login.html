<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluemores · Sign in</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1b2333; --muted:#6b7487; --border:#dfe3ec; --accent:#2f6fed; --danger:#d93f3f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#171e2e; --text:#e6eaf2; --muted:#8c95a8; --border:#26304a; --accent:#5b8cff; --danger:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:14px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  .err { color:var(--danger); font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🔵 Bluemores</h1>
  <p>Enter the passphrase to view the monitor.</p>
  <input type="password" name="passphrase" placeholder="Passphrase" autofocus required autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="err" id="err">Wrong passphrase.</div>
</form>
<script>
  if (new URLSearchParams(location.search).has('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
